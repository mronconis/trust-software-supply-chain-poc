apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: trusted-supply-chain
  labels:
    app.kubernetes.io/part-of: trust-software-supply-chain
spec:
  description: >
    Full trusted supply chain: git clone → build → push → SBOM →
    collect ACS+Trustify evidence → Conforma CVE gate → ACS FP sync → Cosign.
  params:
    - name: IMAGE
      type: string
      default: "quay.io/mronconi/trusted-quarkus-app:latest"
    - name: GIT_URL
      type: string
      default: "https://github.com/mronconis/trust-software-supply-chain-poc.git"
    - name: GIT_REVISION
      type: string
      default: "main"
    - name: APP_CONTEXT
      type: string
      default: "quarkus-app"
    - name: ROX_CENTRAL_ADDRESS
      type: string
      default: "central.stackrox.svc:443"
      description: "StackRox/ACS Central endpoint (host:port)."
    - name: TRUSTIFY_URL
      type: string
      default: "http://trustify-server.trustify.svc:8080"
      description: "Trustify API base URL for VEX known_not_affected lookup."
  workspaces:
    - name: shared-workspace
    - name: cosign-keys
    - name: dockerconfig
    - name: roxctl-secret
    - name: gate-scripts
      description: "ConfigMap with gate/*.py collectors"
    - name: conforma-policy
      description: "ConfigMap with Conforma policy.yaml + Rego"

  tasks:
    - name: build-and-push
      taskRef:
        name: build-and-push
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: GIT_URL
          value: $(params.GIT_URL)
        - name: GIT_REVISION
          value: $(params.GIT_REVISION)
        - name: APP_CONTEXT
          value: $(params.APP_CONTEXT)
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: dockerconfig

    - name: generate-sbom
      runAfter: [build-and-push]
      taskRef:
        name: generate-sbom
      params:
        - name: IMAGE
          value: $(params.IMAGE)
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: dockerconfig

    - name: collect-security-evidence
      runAfter: [generate-sbom]
      taskRef:
        name: collect-security-evidence
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: ROX_CENTRAL_ADDRESS
          value: $(params.ROX_CENTRAL_ADDRESS)
        - name: TRUSTIFY_URL
          value: $(params.TRUSTIFY_URL)
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: dockerconfig
        - name: roxctl-secret
          workspace: roxctl-secret
        - name: gate-scripts
          workspace: gate-scripts

    - name: conforma-cve-gate
      runAfter: [collect-security-evidence]
      taskRef:
        name: conforma-cve-gate
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: conforma-policy
          workspace: conforma-policy

    - name: sync-acs-false-positives
      runAfter: [conforma-cve-gate]
      taskRef:
        name: sync-acs-false-positives
      params:
        - name: ROX_CENTRAL_ADDRESS
          value: $(params.ROX_CENTRAL_ADDRESS)
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: roxctl-secret
          workspace: roxctl-secret
        - name: gate-scripts
          workspace: gate-scripts

    - name: sign-and-attest
      runAfter: [sync-acs-false-positives]
      taskRef:
        name: sign-and-attest
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: IMAGE_DIGEST
          value: $(tasks.build-and-push.results.IMAGE_DIGEST)
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: cosign-keys
          workspace: cosign-keys
        - name: dockerconfig
          workspace: dockerconfig

  finally:
    - name: pipeline-summary
      taskSpec:
        steps:
          - name: summary
            image: alpine:3.20
            script: |
              #!/bin/sh
              cat <<EOF

              ╔═══════════════════════════════════════════════════════════╗
              ║   TRUSTED SUPPLY CHAIN — PIPELINE COMPLETE              ║
              ╠═══════════════════════════════════════════════════════════╣
              ║   Image : $(params.IMAGE)
              ║   Source: $(params.GIT_URL) @ $(params.GIT_REVISION)
              ║   Gate  : Conforma (ACS evidence + Trustify VEX)
              ║                                                         ║
              ║   If any task failed, the image was NOT signed.         ║
              ║   Run: cosign verify --key cosign.pub $(params.IMAGE)   ║
              ╚═══════════════════════════════════════════════════════════╝
              EOF
