apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: security-gate
  labels:
    app.kubernetes.io/part-of: trusted-software-supply-chain
spec:
  description: >
    Scans the image with StackRox/RHACS (roxctl image scan), ingests the
    SBOM into GUAC, and enforces ACS build-time policies (roxctl image check)
    as a security gate. Policy exceptions (CVE allowlists, severity
    thresholds) are managed centrally in ACS Central.
  params:
    - name: IMAGE
      type: string
    - name: ROX_CENTRAL_ADDRESS
      type: string
      description: "StackRox/ACS Central endpoint (host:port)"
  workspaces:
    - name: source
    - name: dockerconfig
    - name: roxctl-secret
      description: "Kubernetes Secret with key 'rox-api-token'"
  results:
    - name: GATE_RESULT
      description: "PASSED or FAILED"
    - name: CRITICAL_COUNT
      description: "Number of critical vulnerabilities found"
    - name: TOTAL_VULN_COUNT
      description: "Total number of vulnerabilities found"
  steps:
    # ── Step 0: Ensure ACS Central has Quay.io registry credentials ──
    - name: ensure-acs-registry-integration
      image: alpine:3.20
      env:
        - name: ROX_CENTRAL_ADDRESS
          value: "$(params.ROX_CENTRAL_ADDRESS)"
      script: |
        #!/bin/sh
        set -eu
        apk add --no-cache -q curl jq 2>/dev/null || true

        ROX_API_TOKEN="$(cat $(workspaces.roxctl-secret.path)/rox-api-token)"
        CENTRAL="https://${ROX_CENTRAL_ADDRESS}"

        # Extract the registry hostname from the image reference
        IMAGE="$(params.IMAGE)"
        REGISTRY="${IMAGE%%/*}"

        echo "▸ Ensuring ACS Central has registry credentials for ${REGISTRY}..."

        # Parse credentials from the dockerconfig workspace
        DOCKERCFG=""
        for f in \
          "$(workspaces.dockerconfig.path)/.dockerconfigjson" \
          "$(workspaces.dockerconfig.path)/config.json" \
          "$(workspaces.dockerconfig.path)/.dockercfg"; do
          if [ -f "${f}" ]; then
            DOCKERCFG="${f}"
            break
          fi
        done

        if [ -z "${DOCKERCFG}" ]; then
          echo "  ⚠ No docker config found in workspace — skipping (Central may already have credentials)"
          exit 0
        fi

        # Extract username and password for the registry
        REG_AUTH=$(jq -r \
          --arg reg "${REGISTRY}" \
          '.auths[$reg].auth // empty' \
          "${DOCKERCFG}" 2>/dev/null || true)

        if [ -z "${REG_AUTH}" ]; then
          echo "  ⚠ No credentials found for ${REGISTRY} in dockerconfig — skipping"
          exit 0
        fi

        REG_USER=$(echo "${REG_AUTH}" | base64 -d 2>/dev/null | cut -d: -f1)
        REG_PASS=$(echo "${REG_AUTH}" | base64 -d 2>/dev/null | cut -d: -f2-)

        if [ -z "${REG_USER}" ] || [ -z "${REG_PASS}" ]; then
          echo "  ⚠ Could not parse registry credentials — skipping"
          exit 0
        fi

        echo "  ✓ Found credentials for ${REGISTRY} (user: ${REG_USER})"

        # Check if a Docker Registry integration for this registry already exists
        EXISTING_ID=$(curl -sk "${CENTRAL}/v1/imageintegrations" \
          -H "Authorization: Bearer ${ROX_API_TOKEN}" 2>/dev/null \
          | jq -r \
            --arg reg "${REGISTRY}" \
            '[.integrations[]? | select(.type == "docker" and (.docker.endpoint // "" | contains($reg)))] | first | .id // empty' \
          2>/dev/null || true)

        if [ -n "${EXISTING_ID}" ]; then
          echo "  ✓ Docker Registry integration already exists (id: ${EXISTING_ID})"
          echo "  ▸ Updating credentials..."

          # Update existing integration with fresh credentials
          curl -sk -X PUT "${CENTRAL}/v1/imageintegrations/${EXISTING_ID}" \
            -H "Authorization: Bearer ${ROX_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"id\": \"${EXISTING_ID}\",
              \"name\": \"${REGISTRY} (pipeline-managed)\",
              \"type\": \"docker\",
              \"categories\": [\"REGISTRY\"],
              \"docker\": {
                \"endpoint\": \"${REGISTRY}\",
                \"username\": \"${REG_USER}\",
                \"password\": \"${REG_PASS}\",
                \"insecure\": false
              },
              \"skipTestIntegration\": true,
              \"autogenerated\": false
            }" >/dev/null 2>&1 && echo "  ✅ Integration updated" || echo "  ⚠ Update failed (non-blocking)"
        else
          echo "  ▸ Creating Docker Registry integration for ${REGISTRY}..."
          RESULT=$(curl -sk "${CENTRAL}/v1/imageintegrations" \
            -H "Authorization: Bearer ${ROX_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"${REGISTRY} (pipeline-managed)\",
              \"type\": \"docker\",
              \"categories\": [\"REGISTRY\"],
              \"docker\": {
                \"endpoint\": \"${REGISTRY}\",
                \"username\": \"${REG_USER}\",
                \"password\": \"${REG_PASS}\",
                \"insecure\": false
              },
              \"skipTestIntegration\": true,
              \"autogenerated\": false
            }" 2>/dev/null)

          if echo "${RESULT}" | grep -q '"id"'; then
            echo "  ✅ Docker Registry integration created for ${REGISTRY}"
          else
            echo "  ⚠ Could not create integration: ${RESULT}"
            echo "    (This is non-blocking — Central may already have access)"
          fi
        fi

        echo "  ▸ Waiting 5s for Central to sync the new integration..."
        sleep 5

    # ── Step 1: Vulnerability scan with roxctl ───────────────────
    - name: roxctl-image-scan
      image: alpine:3.20
      env:
        - name: ROX_CENTRAL_ADDRESS
          value: "$(params.ROX_CENTRAL_ADDRESS)"
      script: |
        #!/bin/sh
        set -eu
        export ROX_API_TOKEN="$(cat $(workspaces.roxctl-secret.path)/rox-api-token)"
        ROXCTL="$(workspaces.source.path)/.roxctl"

        ARCH="$(uname -m)"
        case "${ARCH}" in
          x86_64)  ARCH_SUFFIX="amd64" ;;
          aarch64) ARCH_SUFFIX="arm64" ;;
          *)       ARCH_SUFFIX="amd64" ;;
        esac

        echo "▸ Downloading roxctl (${ARCH_SUFFIX}) from Central..."
        wget -qO "${ROXCTL}" \
          "https://${ROX_CENTRAL_ADDRESS}/api/cli/download/roxctl-linux-${ARCH_SUFFIX}" \
          --no-check-certificate \
          --header="Authorization: Bearer ${ROX_API_TOKEN}"
        chmod +x "${ROXCTL}"

        echo "▸ Scanning image: $(params.IMAGE)"
        echo ""
        echo "╔═══════════════════════════════════════════════════════════╗"
        echo "║  STACKROX VULNERABILITY SCAN                             ║"
        echo "╚═══════════════════════════════════════════════════════════╝"

        "${ROXCTL}" image scan \
          --endpoint "${ROX_CENTRAL_ADDRESS}" \
          --image "$(params.IMAGE)" \
          --insecure-skip-tls-verify \
          --output table \
          --force 2>&1 || true

        "${ROXCTL}" image scan \
          --endpoint "${ROX_CENTRAL_ADDRESS}" \
          --image "$(params.IMAGE)" \
          --insecure-skip-tls-verify \
          --output json \
          --force \
          > "$(workspaces.source.path)/roxctl-scan-results.json" 2>/dev/null || true

    # ── Step 2: Enforce build-time policies with roxctl ──────────
    - name: roxctl-image-check
      image: alpine:3.20
      env:
        - name: ROX_CENTRAL_ADDRESS
          value: "$(params.ROX_CENTRAL_ADDRESS)"
      script: |
        #!/bin/sh
        set -eu
        export ROX_API_TOKEN="$(cat $(workspaces.roxctl-secret.path)/rox-api-token)"
        ROXCTL="$(workspaces.source.path)/.roxctl"

        apk add --no-cache -q jq 2>/dev/null || true

        SCAN_JSON="$(workspaces.source.path)/roxctl-scan-results.json"
        CRITICAL="0"
        TOTAL="0"
        if [ -f "${SCAN_JSON}" ] && command -v jq >/dev/null 2>&1; then
          CRITICAL=$(jq '[.scan.components[]?.vulns[]? | select(.severity == "CRITICAL_VULNERABILITY_SEVERITY")] | length' "${SCAN_JSON}" 2>/dev/null || echo "0")
          TOTAL=$(jq '[.scan.components[]?.vulns[]?] | length' "${SCAN_JSON}" 2>/dev/null || echo "0")
        fi
        printf "%s" "${CRITICAL}" > "$(results.CRITICAL_COUNT.path)"
        printf "%s" "${TOTAL}" > "$(results.TOTAL_VULN_COUNT.path)"

        echo ""
        echo "╔═══════════════════════════════════════════════════════════╗"
        echo "║  STACKROX BUILD-TIME POLICY CHECK                       ║"
        echo "╠═══════════════════════════════════════════════════════════╣"
        echo "║  Image    : $(params.IMAGE)"
        echo "║  Central  : ${ROX_CENTRAL_ADDRESS}"
        echo "║  CRITICAL : ${CRITICAL}"
        echo "║  TOTAL    : ${TOTAL}"
        echo "╚═══════════════════════════════════════════════════════════╝"
        echo ""

        if "${ROXCTL}" image check \
          --endpoint "${ROX_CENTRAL_ADDRESS}" \
          --image "$(params.IMAGE)" \
          --insecure-skip-tls-verify \
          --output table; then
          echo ""
          echo "✅ SECURITY GATE PASSED — all ACS build-time policies satisfied"
          printf "PASSED" > "$(results.GATE_RESULT.path)"
        else
          echo ""
          echo "❌ SECURITY GATE FAILED — ACS build-time policy violation(s) detected"
          printf "FAILED" > "$(results.GATE_RESULT.path)"
          exit 1
        fi
