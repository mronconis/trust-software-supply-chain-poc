apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: security-gate
  labels:
    app.kubernetes.io/part-of: trusted-software-supply-chain
spec:
  description: >
    Scans the image with StackRox/RHACS (roxctl image scan) and enforces ACS
    build-time policies (roxctl image check). Violations whose CVEs are marked
    not_affected in Trustify (VEX/CSAF) are waived and do not fail the gate.
  params:
    - name: IMAGE
      type: string
    - name: ROX_CENTRAL_ADDRESS
      type: string
      description: "StackRox/ACS Central endpoint (host:port)"
    - name: TRUSTIFY_URL
      type: string
      default: "http://trustify-server.trustify.svc:8080"
      description: "Trustify API base URL used to resolve VEX not_affected CVEs"
  workspaces:
    - name: source
    - name: dockerconfig
    - name: roxctl-secret
      description: "Kubernetes Secret with key 'rox-api-token'"
  results:
    - name: GATE_RESULT
      description: "PASSED or FAILED"
    - name: CRITICAL_COUNT
      description: "Number of critical vulnerabilities found"
    - name: TOTAL_VULN_COUNT
      description: "Total number of vulnerabilities found"
    - name: VEX_WAIVED_COUNT
      description: "Number of unique CVEs waived via Trustify VEX not_affected"
  steps:
    # ── Step 0: Ensure ACS Central has Quay.io registry credentials ──
    - name: ensure-acs-registry-integration
      image: alpine:3.20
      env:
        - name: ROX_CENTRAL_ADDRESS
          value: "$(params.ROX_CENTRAL_ADDRESS)"
      script: |
        #!/bin/sh
        set -eu
        apk add --no-cache -q curl jq 2>/dev/null || true

        ROX_API_TOKEN="$(cat $(workspaces.roxctl-secret.path)/rox-api-token)"
        CENTRAL="https://${ROX_CENTRAL_ADDRESS}"

        # Extract the registry hostname from the image reference
        IMAGE="$(params.IMAGE)"
        REGISTRY="${IMAGE%%/*}"

        echo "▸ Ensuring ACS Central has registry credentials for ${REGISTRY}..."

        # Parse credentials from the dockerconfig workspace
        DOCKERCFG=""
        for f in \
          "$(workspaces.dockerconfig.path)/.dockerconfigjson" \
          "$(workspaces.dockerconfig.path)/config.json" \
          "$(workspaces.dockerconfig.path)/.dockercfg"; do
          if [ -f "${f}" ]; then
            DOCKERCFG="${f}"
            break
          fi
        done

        if [ -z "${DOCKERCFG}" ]; then
          echo "  ⚠ No docker config found in workspace — skipping (Central may already have credentials)"
          exit 0
        fi

        # Extract username and password for the registry
        REG_AUTH=$(jq -r \
          --arg reg "${REGISTRY}" \
          '.auths[$reg].auth // empty' \
          "${DOCKERCFG}" 2>/dev/null || true)

        if [ -z "${REG_AUTH}" ]; then
          echo "  ⚠ No credentials found for ${REGISTRY} in dockerconfig — skipping"
          exit 0
        fi

        REG_USER=$(echo "${REG_AUTH}" | base64 -d 2>/dev/null | cut -d: -f1)
        REG_PASS=$(echo "${REG_AUTH}" | base64 -d 2>/dev/null | cut -d: -f2-)

        if [ -z "${REG_USER}" ] || [ -z "${REG_PASS}" ]; then
          echo "  ⚠ Could not parse registry credentials — skipping"
          exit 0
        fi

        echo "  ✓ Found credentials for ${REGISTRY} (user: ${REG_USER})"

        # Check if a Docker Registry integration for this registry already exists
        EXISTING_ID=$(curl -sk "${CENTRAL}/v1/imageintegrations" \
          -H "Authorization: Bearer ${ROX_API_TOKEN}" 2>/dev/null \
          | jq -r \
            --arg reg "${REGISTRY}" \
            '[.integrations[]? | select(.type == "docker" and (.docker.endpoint // "" | contains($reg)))] | first | .id // empty' \
          2>/dev/null || true)

        if [ -n "${EXISTING_ID}" ]; then
          echo "  ✓ Docker Registry integration already exists (id: ${EXISTING_ID})"
          echo "  ▸ Updating credentials..."

          # Update existing integration with fresh credentials
          curl -sk -X PUT "${CENTRAL}/v1/imageintegrations/${EXISTING_ID}" \
            -H "Authorization: Bearer ${ROX_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"id\": \"${EXISTING_ID}\",
              \"name\": \"${REGISTRY} (pipeline-managed)\",
              \"type\": \"docker\",
              \"categories\": [\"REGISTRY\"],
              \"docker\": {
                \"endpoint\": \"${REGISTRY}\",
                \"username\": \"${REG_USER}\",
                \"password\": \"${REG_PASS}\",
                \"insecure\": false
              },
              \"skipTestIntegration\": true,
              \"autogenerated\": false
            }" >/dev/null 2>&1 && echo "  ✅ Integration updated" || echo "  ⚠ Update failed (non-blocking)"
        else
          echo "  ▸ Creating Docker Registry integration for ${REGISTRY}..."
          RESULT=$(curl -sk "${CENTRAL}/v1/imageintegrations" \
            -H "Authorization: Bearer ${ROX_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"${REGISTRY} (pipeline-managed)\",
              \"type\": \"docker\",
              \"categories\": [\"REGISTRY\"],
              \"docker\": {
                \"endpoint\": \"${REGISTRY}\",
                \"username\": \"${REG_USER}\",
                \"password\": \"${REG_PASS}\",
                \"insecure\": false
              },
              \"skipTestIntegration\": true,
              \"autogenerated\": false
            }" 2>/dev/null)

          if echo "${RESULT}" | grep -q '"id"'; then
            echo "  ✅ Docker Registry integration created for ${REGISTRY}"
          else
            echo "  ⚠ Could not create integration: ${RESULT}"
            echo "    (This is non-blocking — Central may already have access)"
          fi
        fi

        echo "  ▸ Waiting 5s for Central to sync the new integration..."
        sleep 5

    # ── Step 1: Vulnerability scan with roxctl ───────────────────
    - name: roxctl-image-scan
      image: alpine:3.20
      env:
        - name: ROX_CENTRAL_ADDRESS
          value: "$(params.ROX_CENTRAL_ADDRESS)"
      script: |
        #!/bin/sh
        set -eu
        export ROX_API_TOKEN="$(cat $(workspaces.roxctl-secret.path)/rox-api-token)"
        ROXCTL="$(workspaces.source.path)/.roxctl"

        ARCH="$(uname -m)"
        case "${ARCH}" in
          x86_64)  ARCH_SUFFIX="amd64" ;;
          aarch64) ARCH_SUFFIX="arm64" ;;
          *)       ARCH_SUFFIX="amd64" ;;
        esac

        echo "▸ Downloading roxctl (${ARCH_SUFFIX}) from Central..."
        wget -qO "${ROXCTL}" \
          "https://${ROX_CENTRAL_ADDRESS}/api/cli/download/roxctl-linux-${ARCH_SUFFIX}" \
          --no-check-certificate \
          --header="Authorization: Bearer ${ROX_API_TOKEN}"
        chmod +x "${ROXCTL}"

        echo "▸ Scanning image: $(params.IMAGE)"
        echo ""
        echo "╔═══════════════════════════════════════════════════════════╗"
        echo "║  STACKROX VULNERABILITY SCAN                             ║"
        echo "╚═══════════════════════════════════════════════════════════╝"

        "${ROXCTL}" image scan \
          --endpoint "${ROX_CENTRAL_ADDRESS}" \
          --image "$(params.IMAGE)" \
          --insecure-skip-tls-verify \
          --output table \
          --force 2>&1 || true

        "${ROXCTL}" image scan \
          --endpoint "${ROX_CENTRAL_ADDRESS}" \
          --image "$(params.IMAGE)" \
          --insecure-skip-tls-verify \
          --output json \
          --force \
          > "$(workspaces.source.path)/roxctl-scan-results.json" 2>/dev/null || true

    # ── Step 2: Policy check + Trustify VEX waive ────────────────
    - name: roxctl-image-check
      image: alpine:3.20
      env:
        - name: ROX_CENTRAL_ADDRESS
          value: "$(params.ROX_CENTRAL_ADDRESS)"
        - name: TRUSTIFY_URL
          value: "$(params.TRUSTIFY_URL)"
      script: |
        #!/bin/sh
        set -eu
        export ROX_API_TOKEN="$(cat $(workspaces.roxctl-secret.path)/rox-api-token)"
        ROXCTL="$(workspaces.source.path)/.roxctl"
        SOURCE="$(workspaces.source.path)"

        apk add --no-cache -q curl jq 2>/dev/null || true

        SCAN_JSON="${SOURCE}/roxctl-scan-results.json"
        CHECK_JSON="${SOURCE}/roxctl-check-results.json"
        VEX_CVES="${SOURCE}/trustify-not-affected-cves.txt"
        SBOM_FILE="${SOURCE}/sbom-cyclonedx.json"

        CRITICAL="0"
        TOTAL="0"
        if [ -f "${SCAN_JSON}" ] && command -v jq >/dev/null 2>&1; then
          CRITICAL=$(jq '[.scan.components[]?.vulns[]? | select(.severity == "CRITICAL_VULNERABILITY_SEVERITY")] | length' "${SCAN_JSON}" 2>/dev/null || echo "0")
          TOTAL=$(jq '[.scan.components[]?.vulns[]?] | length' "${SCAN_JSON}" 2>/dev/null || echo "0")
        fi
        printf "%s" "${CRITICAL}" > "$(results.CRITICAL_COUNT.path)"
        printf "%s" "${TOTAL}" > "$(results.TOTAL_VULN_COUNT.path)"

        echo ""
        echo "╔═══════════════════════════════════════════════════════════╗"
        echo "║  STACKROX BUILD-TIME POLICY CHECK                       ║"
        echo "╠═══════════════════════════════════════════════════════════╣"
        echo "║  Image    : $(params.IMAGE)"
        echo "║  Central  : ${ROX_CENTRAL_ADDRESS}"
        echo "║  Trustify : ${TRUSTIFY_URL}"
        echo "║  CRITICAL : ${CRITICAL}"
        echo "║  TOTAL    : ${TOTAL}"
        echo "╚═══════════════════════════════════════════════════════════╝"
        echo ""

        # Table output for human-readable logs (non-blocking on failure)
        "${ROXCTL}" image check \
          --endpoint "${ROX_CENTRAL_ADDRESS}" \
          --image "$(params.IMAGE)" \
          --insecure-skip-tls-verify \
          --output table 2>&1 || true

        # JSON output drives the VEX-aware gate decision
        CHECK_RC=0
        "${ROXCTL}" image check \
          --endpoint "${ROX_CENTRAL_ADDRESS}" \
          --image "$(params.IMAGE)" \
          --insecure-skip-tls-verify \
          --output json \
          > "${CHECK_JSON}" 2>/dev/null || CHECK_RC=$?

        # ── Collect Trustify not_affected CVEs ───────────────────
        : > "${VEX_CVES}"
        echo ""
        echo "╔═══════════════════════════════════════════════════════════╗"
        echo "║  TRUSTIFY VEX — not_affected CVE LOOKUP                  ║"
        echo "╚═══════════════════════════════════════════════════════════╝"

        if curl -sf "${TRUSTIFY_URL}/" >/dev/null 2>&1 || curl -sf "${TRUSTIFY_URL}/api/v3/advisory?limit=1" >/dev/null 2>&1; then
          # Primary: analyze SBOM PURLs with include_resolved=true
          if [ -f "${SBOM_FILE}" ]; then
            echo "▸ Extracting PURLs from SBOM and querying Trustify analyze..."
            jq -c '{purls: ([.components[]?.purl // empty] | unique | .[0:200]), include_resolved: true}' \
              "${SBOM_FILE}" > "${SOURCE}/trustify-analyze-request.json" 2>/dev/null || \
              echo '{"purls":[],"include_resolved":true}' > "${SOURCE}/trustify-analyze-request.json"

            HTTP_CODE=$(curl -s -o "${SOURCE}/trustify-analyze-response.json" -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              --data-binary @"${SOURCE}/trustify-analyze-request.json" \
              "${TRUSTIFY_URL}/api/v3/vulnerability/analyze" 2>/dev/null || echo "000")

            if [ "${HTTP_CODE}" = "200" ]; then
              # Response is a map: purl -> { details: [ { identifier, purl_statuses: [{status}] } ] }
              jq -r '
                to_entries[]?.value.details[]? as $d
                | select(
                    ($d.purl_statuses // [])
                    | map(.status // .purl_status.status // empty)
                    | map(ascii_downcase)
                    | index("not_affected")
                  )
                | ($d.identifier // $d.head.identifier // empty)
              ' "${SOURCE}/trustify-analyze-response.json" 2>/dev/null \
                | grep -E '^CVE-[0-9]{4}-[0-9]+$' \
                | sort -u >> "${VEX_CVES}" || true
              echo "  ✓ Analyze returned HTTP ${HTTP_CODE}"
            else
              echo "  ⚠ Analyze returned HTTP ${HTTP_CODE} — falling back to advisory scan"
            fi
          else
            echo "  ⚠ SBOM not found at ${SBOM_FILE} — skipping analyze"
          fi

          # Fallback / supplement: scan advisories for CSAF VEX known_not_affected
          echo "▸ Scanning Trustify advisories for VEX known_not_affected..."
          curl -sf "${TRUSTIFY_URL}/api/v3/advisory?limit=100" \
            -o "${SOURCE}/trustify-advisories.json" 2>/dev/null || true

          if [ -f "${SOURCE}/trustify-advisories.json" ]; then
            # Try common paginated shapes for advisory identifiers / UUIDs
            ADVISORY_IDS=$(jq -r '
              (.items // .data // .)
              | if type == "array" then .[] else empty end
              | (.uuid // .id // .identifier // empty)
            ' "${SOURCE}/trustify-advisories.json" 2>/dev/null || true)

            for ADV_ID in ${ADVISORY_IDS}; do
              [ -z "${ADV_ID}" ] && continue
              # Download raw advisory document when available
              ADV_FILE="${SOURCE}/adv-$(echo "${ADV_ID}" | tr '/:' '__').json"
              if curl -sf "${TRUSTIFY_URL}/api/v3/advisory/${ADV_ID}/download" \
                   -o "${ADV_FILE}" 2>/dev/null \
                 || curl -sf "${TRUSTIFY_URL}/api/v3/advisory/${ADV_ID}" \
                   -o "${ADV_FILE}" 2>/dev/null; then
                # CSAF VEX: vulnerabilities with known_not_affected product_status
                jq -r '
                  (.. | objects | select(has("vulnerabilities")) | .vulnerabilities[]?) as $v
                  | select(
                      ($v.product_status.known_not_affected // [])
                      | length > 0
                    )
                  | ($v.cve // empty)
                ' "${ADV_FILE}" 2>/dev/null \
                  | grep -E '^CVE-[0-9]{4}-[0-9]+$' \
                  | sort -u >> "${VEX_CVES}" || true

                # Also accept Trustify API summary shapes exposing status
                jq -r '
                  (.. | objects | select(has("status")) | .) as $s
                  | select((($s.status // "") | ascii_downcase) == "not_affected")
                  | ($s.vulnerability // $s.identifier // $s.cve // empty)
                ' "${ADV_FILE}" 2>/dev/null \
                  | grep -E '^CVE-[0-9]{4}-[0-9]+$' \
                  | sort -u >> "${VEX_CVES}" || true
              fi
            done
          fi

          sort -u "${VEX_CVES}" -o "${VEX_CVES}"
        else
          echo "  ⚠ Trustify not reachable at ${TRUSTIFY_URL} — proceeding without VEX waivers"
        fi

        WAIVED_COUNT=$(wc -l < "${VEX_CVES}" | tr -d ' ')
        [ -n "${WAIVED_COUNT}" ] || WAIVED_COUNT=0
        printf "%s" "${WAIVED_COUNT}" > "$(results.VEX_WAIVED_COUNT.path)"

        if [ "${WAIVED_COUNT}" -gt 0 ]; then
          echo "  ✓ Trustify not_affected CVEs (${WAIVED_COUNT}):"
          sed 's/^/      /' "${VEX_CVES}"
        else
          echo "  ▸ No not_affected CVEs found in Trustify"
        fi

        # ── Apply VEX waivers to ACS policy violations ───────────
        echo ""
        echo "╔═══════════════════════════════════════════════════════════╗"
        echo "║  VEX-AWARE GATE DECISION                                 ║"
        echo "╚═══════════════════════════════════════════════════════════╝"

        if [ "${CHECK_RC}" -eq 0 ]; then
          echo ""
          echo "✅ SECURITY GATE PASSED — all ACS build-time policies satisfied"
          printf "PASSED" > "$(results.GATE_RESULT.path)"
          exit 0
        fi

        if [ ! -f "${CHECK_JSON}" ]; then
          echo "❌ SECURITY GATE FAILED — image check failed and no JSON output available"
          printf "FAILED" > "$(results.GATE_RESULT.path)"
          exit 1
        fi

        # Build a jq array of waived CVE strings
        WAIVED_JSON=$(jq -R -s 'split("\n") | map(select(length > 0))' "${VEX_CVES}")

        # Remaining failing policies after VEX waivers.
        # A violation is dropped when:
        #   - its text cites a waived CVE, OR
        #   - it cites no CVE id AND the policy name/description cites a waived CVE
        #     (covers ACS CVE-specific policies whose messages omit the id).
        REMAINING=$(jq --argjson waived "${WAIVED_JSON}" '
          def cites_waived:
            . as $msg
            | ($waived | map(select($msg | contains(.))) | length) > 0;
          def cites_any_cve:
            test("CVE-[0-9]{4}-[0-9]+");

          [
            .results[]?.violatedPolicies[]?
            | select(.failingCheck == true)
            | . as $policy
            | (($policy.name // "") + " " + ($policy.description // "")) as $meta
            | ($meta | cites_waived) as $meta_waived
            | ($policy.violation // []) as $viols
            | ($viols | map(select(
                (cites_waived | not)
                and (
                  (cites_any_cve and (cites_waived | not))
                  or ((cites_any_cve | not) and ($meta_waived | not))
                )
              ))) as $kept
            | select(($kept | length) > 0)
            | {
                name: $policy.name,
                severity: $policy.severity,
                remaining: ($kept | length),
                waived: (($viols | length) - ($kept | length)),
                samples: ($kept | .[0:3])
              }
          ]
        ' "${CHECK_JSON}")

        REMAINING_COUNT=$(echo "${REMAINING}" | jq 'length')
        TOTAL_WAIVED_VIOLATIONS=$(jq --argjson waived "${WAIVED_JSON}" '
          def cites_waived:
            . as $msg
            | ($waived | map(select($msg | contains(.))) | length) > 0;
          def cites_any_cve:
            test("CVE-[0-9]{4}-[0-9]+");

          [
            .results[]?.violatedPolicies[]?
            | select(.failingCheck == true)
            | . as $policy
            | (($policy.name // "") + " " + ($policy.description // "")) as $meta
            | ($meta | cites_waived) as $meta_waived
            | ($policy.violation // [])[]?
            | select(
                cites_waived
                or ((cites_any_cve | not) and $meta_waived)
              )
          ] | length
        ' "${CHECK_JSON}")

        echo "  ACS image check exit code : ${CHECK_RC}"
        echo "  VEX waived CVEs           : ${WAIVED_COUNT}"
        echo "  Violations waived by VEX  : ${TOTAL_WAIVED_VIOLATIONS}"
        echo "  Remaining failing policies: ${REMAINING_COUNT}"
        echo ""

        if [ "${REMAINING_COUNT}" -eq 0 ]; then
          echo "✅ SECURITY GATE PASSED — ACS violations fully waived by Trustify VEX (not_affected)"
          if [ "${WAIVED_COUNT}" -gt 0 ]; then
            echo "   Waived CVEs:"
            sed 's/^/     - /' "${VEX_CVES}"
          fi
          printf "PASSED" > "$(results.GATE_RESULT.path)"
          exit 0
        fi

        echo "❌ SECURITY GATE FAILED — remaining ACS build-time policy violation(s):"
        echo "${REMAINING}" | jq -r '.[] | "  • \(.name) [\(.severity)] — \(.remaining) violation(s) left (\(.waived) waived)\n    e.g. \(.samples[0] // "n/a")"'
        printf "FAILED" > "$(results.GATE_RESULT.path)"
        exit 1
