apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: collect-security-evidence
  labels:
    app.kubernetes.io/part-of: trusted-software-supply-chain
spec:
  description: >
    Informational ACS image scan plus Trustify CSAF VEX collection.
    Writes a SecurityEvidence JSON bundle for the Conforma CVE gate.
  params:
    - name: IMAGE
      type: string
    - name: ROX_CENTRAL_ADDRESS
      type: string
    - name: TRUSTIFY_URL
      type: string
      default: "http://trustify-server.trustify.svc:8080"
  workspaces:
    - name: source
    - name: dockerconfig
    - name: roxctl-secret
    - name: gate-scripts
      description: "ConfigMap gate-scripts mounted read-only"
  results:
    - name: CRITICAL_COUNT
      description: "CRITICAL CVEs from ACS scan"
    - name: TOTAL_VULN_COUNT
      description: "Total vulnerabilities from ACS scan"
    - name: VEX_WAIVED_COUNT
      description: "CRITICAL CVEs also listed in Trustify VEX"
    - name: BLOCKING_COUNT
      description: "CRITICAL CVEs not waived (pre-Conforma preview)"
  steps:
    - name: ensure-acs-registry-integration
      image: alpine:3.20
      env:
        - name: ROX_CENTRAL_ADDRESS
          value: "$(params.ROX_CENTRAL_ADDRESS)"
      script: |
        #!/bin/sh
        set -eu
        apk add --no-cache -q curl jq 2>/dev/null || true

        ROX_API_TOKEN="$(cat $(workspaces.roxctl-secret.path)/rox-api-token)"
        CENTRAL="https://${ROX_CENTRAL_ADDRESS}"
        IMAGE="$(params.IMAGE)"
        REGISTRY="${IMAGE%%/*}"

        echo "▸ Ensuring ACS registry credentials for ${REGISTRY}..."

        DOCKERCFG=""
        for f in \
          "$(workspaces.dockerconfig.path)/.dockerconfigjson" \
          "$(workspaces.dockerconfig.path)/config.json" \
          "$(workspaces.dockerconfig.path)/.dockercfg"; do
          if [ -f "${f}" ]; then
            DOCKERCFG="${f}"
            break
          fi
        done

        if [ -z "${DOCKERCFG}" ]; then
          echo "  ⚠ No docker config — skipping"
          exit 0
        fi

        REG_AUTH=$(jq -r --arg reg "${REGISTRY}" '.auths[$reg].auth // empty' "${DOCKERCFG}" 2>/dev/null || true)
        if [ -z "${REG_AUTH}" ]; then
          echo "  ⚠ No credentials for ${REGISTRY} — skipping"
          exit 0
        fi

        REG_USER=$(echo "${REG_AUTH}" | base64 -d 2>/dev/null | cut -d: -f1)
        REG_PASS=$(echo "${REG_AUTH}" | base64 -d 2>/dev/null | cut -d: -f2-)
        if [ -z "${REG_USER}" ] || [ -z "${REG_PASS}" ]; then
          echo "  ⚠ Could not parse registry credentials — skipping"
          exit 0
        fi

        EXISTING_ID=$(curl -sk "${CENTRAL}/v1/imageintegrations" \
          -H "Authorization: Bearer ${ROX_API_TOKEN}" 2>/dev/null \
          | jq -r --arg reg "${REGISTRY}" \
            '[.integrations[]? | select(.type == "docker" and (.docker.endpoint // "" | contains($reg)))] | first | .id // empty' \
          2>/dev/null || true)

        BODY=$(jq -n \
          --arg id "${EXISTING_ID}" \
          --arg reg "${REGISTRY}" \
          --arg user "${REG_USER}" \
          --arg pass "${REG_PASS}" \
          '{
            name: ($reg + " (pipeline-managed)"),
            type: "docker",
            categories: ["REGISTRY"],
            docker: {endpoint: $reg, username: $user, password: $pass, insecure: false},
            skipTestIntegration: true,
            autogenerated: false
          } + (if $id != "" then {id: $id} else {} end)')

        if [ -n "${EXISTING_ID}" ]; then
          curl -sk -X PUT "${CENTRAL}/v1/imageintegrations/${EXISTING_ID}" \
            -H "Authorization: Bearer ${ROX_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${BODY}" >/dev/null 2>&1 && echo "  ✅ Integration updated" || echo "  ⚠ Update failed (non-blocking)"
        else
          curl -sk "${CENTRAL}/v1/imageintegrations" \
            -H "Authorization: Bearer ${ROX_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${BODY}" >/dev/null 2>&1 && echo "  ✅ Integration created" || echo "  ⚠ Create failed (non-blocking)"
        fi
        sleep 5

    - name: roxctl-image-scan
      image: alpine:3.20
      env:
        - name: ROX_CENTRAL_ADDRESS
          value: "$(params.ROX_CENTRAL_ADDRESS)"
      script: |
        #!/bin/sh
        set -eu
        export ROX_API_TOKEN="$(cat $(workspaces.roxctl-secret.path)/rox-api-token)"
        ROXCTL="$(workspaces.source.path)/.roxctl"
        SOURCE="$(workspaces.source.path)"

        ARCH="$(uname -m)"
        case "${ARCH}" in
          x86_64)  ARCH_SUFFIX="amd64" ;;
          aarch64) ARCH_SUFFIX="arm64" ;;
          *)       ARCH_SUFFIX="amd64" ;;
        esac

        echo "▸ Downloading roxctl (${ARCH_SUFFIX})..."
        wget -qO "${ROXCTL}" \
          "https://${ROX_CENTRAL_ADDRESS}/api/cli/download/roxctl-linux-${ARCH_SUFFIX}" \
          --no-check-certificate \
          --header="Authorization: Bearer ${ROX_API_TOKEN}"
        chmod +x "${ROXCTL}"

        echo "▸ Scanning image (informational): $(params.IMAGE)"
        echo ""
        echo "╔═══════════════════════════════════════════════════════════╗"
        echo "║  STACKROX VULNERABILITY SCAN (informational)             ║"
        echo "╚═══════════════════════════════════════════════════════════╝"

        "${ROXCTL}" image scan \
          --endpoint "${ROX_CENTRAL_ADDRESS}" \
          --image "$(params.IMAGE)" \
          --insecure-skip-tls-verify \
          --output table \
          --force 2>&1 || true

        "${ROXCTL}" image scan \
          --endpoint "${ROX_CENTRAL_ADDRESS}" \
          --image "$(params.IMAGE)" \
          --insecure-skip-tls-verify \
          --output json \
          --force \
          > "${SOURCE}/roxctl-scan-results.json" 2>/dev/null || true

        echo ""
        echo "  ℹ Scan is non-blocking. Conforma decides pass/fail from evidence."

    - name: assemble-evidence
      image: python:3.12-alpine
      env:
        - name: TRUSTIFY_URL
          value: "$(params.TRUSTIFY_URL)"
      script: |
        #!/bin/sh
        set -eu
        SOURCE="$(workspaces.source.path)"
        GATE="$(workspaces.gate-scripts.path)"
        COUNTS="${SOURCE}/.gate-counts"
        mkdir -p "${COUNTS}"

        echo "╔═══════════════════════════════════════════════════════════╗"
        echo "║  COLLECT SECURITY EVIDENCE                               ║"
        echo "╚═══════════════════════════════════════════════════════════╝"

        python "${GATE}/collect_acs.py" \
          --scan-json "${SOURCE}/roxctl-scan-results.json" \
          --output "${SOURCE}/scan-normalized.json"

        python "${GATE}/collect_trustify.py" \
          --trustify-url "${TRUSTIFY_URL}" \
          --output "${SOURCE}/vex-normalized.json"

        python "${GATE}/assemble_evidence.py" \
          --image "$(params.IMAGE)" \
          --scan-json "${SOURCE}/scan-normalized.json" \
          --vex-json "${SOURCE}/vex-normalized.json" \
          --output "${SOURCE}/evidence.json" \
          --counts-dir "${COUNTS}"

        cp "${COUNTS}/CRITICAL_COUNT" "$(results.CRITICAL_COUNT.path)"
        cp "${COUNTS}/TOTAL_VULN_COUNT" "$(results.TOTAL_VULN_COUNT.path)"
        cp "${COUNTS}/VEX_WAIVED_COUNT" "$(results.VEX_WAIVED_COUNT.path)"
        cp "${COUNTS}/BLOCKING_COUNT" "$(results.BLOCKING_COUNT.path)"

        echo ""
        echo "  Evidence bundle: ${SOURCE}/evidence.json"
