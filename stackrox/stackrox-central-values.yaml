# StackRox Central Services — Helm values for Kind PoC
#
# Tuned for a local Kind cluster with limited resources.
# In production, deploy via the ACS operator on OpenShift.
#
# Chart: stackrox/stackrox-central-services
# Repo:  https://raw.githubusercontent.com/stackrox/helm-charts/main/opensource/
#
# StackRox 5.0+ removed the legacy Scanner. Scanner V4 is required for
# `roxctl image scan` / ACS vulnerability enrichment.
# ─────────────────────────────────────────────────────────────────

central:
  adminPassword:
    value: "stackrox"                       # PoC-only — override in production

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "4Gi"
      cpu: "2000m"

  persistence:
    persistentVolumeClaim:
      size: 5Gi                             # Minimal for PoC

  # Expose Central UI and API via NodePort on 30443
  # kind-config.yaml maps hostPort 30443 → containerPort 30443
  exposure:
    loadBalancer:
      enabled: false
    nodePort:
      enabled: true
      port: 30443
    route:
      enabled: false

  db:
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
    persistence:
      persistentVolumeClaim:
        size: 5Gi

# Legacy Scanner — ignored on StackRox 5.0+ (kept for older charts / docs)
scanner:
  disable: true

# Scanner V4 — required for vulnerability scanning (replaces legacy Scanner)
scannerV4:
  disable: false
  indexer:
    replicas: 1
    autoscaling:
      disable: true
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
  matcher:
    replicas: 1
    autoscaling:
      disable: true
    resources:
      requests:
        memory: "1Gi"
        cpu: "250m"
      limits:
        memory: "3Gi"
        cpu: "1000m"
  db:
    resources:
      requests:
        memory: "512Mi"
        cpu: "100m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
    persistence:
      persistentVolumeClaim:
        claimName: scanner-v4-db
        size: 10Gi
        # Required on helm upgrade: chart defaults createClaim=false when
        # Scanner V4 is enabled after the initial install (IsInstall=false).
        createClaim: true
